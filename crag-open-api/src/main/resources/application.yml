server:
  port: 8081

spring:
  application:
    name: open-api

crag:
  grpc:
    client:
      caller-service: open-api
      token: ${OPEN_API_SERVICE_TOKEN:open-token-demo}
      max-deadline-millis: 10000
    probe:
      targets:
        access-service: access-service:9091
        rag-service: rag-service:9093
  open:
    access:
      target: ${CRAG_OPEN_ACCESS_TARGET:access-service:9091}
    rag:
      target: ${CRAG_OPEN_RAG_TARGET:rag-service:9093}
    auth-cache:
      ttl: 30s
      capacity: 10000
  event:
    consumer:
      enabled: false
    access-stream-key: crag:event:access
    open-invalidation-group: open-invalidation
    open-invalidation-consumer: open-invalidation-1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,downstreamConnectivity
