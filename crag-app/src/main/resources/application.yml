server:
  port: 8080

spring:
  application:
    name: crag-demo

  datasource:
    url: jdbc:postgresql://localhost:5432/crag_demo
    username: crag_user
    password: crag_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none          # DDL 由 schema.sql 手动管理
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always            # 每次启动执行 schema.sql + data.sql
      schema-locations: classpath:schema.sql
      # data-locations: classpath:data.sql  -- plan_1.1 暂时关闭，无种子数据时避免空脚本报错

# ---- CRAG 业务配置 ----
crag:
  embedding:
    sidecar-url: http://localhost:8001    # Docker Compose 通过环境变量 CRAG_EMBEDDING_SIDECAR_URL 覆盖为 http://sidecar:8001
    embed-path: /embed
    connect-timeout: 5s
    read-timeout: 30s
  rerank:
    sidecar-url: http://localhost:8001    # 同上，通过 CRAG_RERANK_SIDECAR_URL 覆盖
    rerank-path: /rerank
    connect-timeout: 5s
    read-timeout: 30s
  cron:
    dense:
      batch-size: 100               # 每轮最多处理数
      interval-cron: "*/10 * * * * *"  # Cron 表达式（每 10 秒）
      processing-timeout: 5m        # processing 超时阈值

  query:
    retrieval:
      top-n: 8
    context:
      max-characters: 12000
    llm:
      provider: stub
      request-timeout: 120s
      deepseek:
        api-key: ${DEEPSEEK_API_KEY:}
        base-url: https://api.deepseek.com/anthropic
        model: deepseek-v4-flash
        temperature: 0
        max-output-tokens: 4096
      stub:
        mode: success

logging:
  level:
    ai.cerbur.crag: INFO
    org.springframework.web: INFO
