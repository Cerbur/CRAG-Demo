server:
  port: 8091

spring:
  application:
    name: access-service
  datasource:
    url: jdbc:postgresql://db:5432/crag_platform?currentSchema=access
    username: crag_access
    password: ${CARG_ACCESS_PASSWORD:access_demo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: never

crag:
  grpc:
    server:
      bind-port: 9091
      shutdown-timeout: PT5S
      allowed-callers:
        console-api: ${CONSOLE_API_SERVICE_TOKEN:console-token-demo}
        open-api: ${OPEN_API_SERVICE_TOKEN:open-token-demo}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,expectedSchema
