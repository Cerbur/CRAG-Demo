spring:
  application:
    name: access-service
  datasource:
    url: jdbc:h2:mem:access_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never

crag:
  grpc:
    server:
      bind-port: 0
      shutdown-timeout: 1s
      allowed-callers:
        test-caller: test-token
