spring:
  application:
    name: access-service
  datasource:
    url: jdbc:h2:mem:access_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-access.sql

crag:
  grpc:
    server:
      bind-port: 0
      shutdown-timeout: 1s
      allowed-callers:
        test-caller: test-token
  access:
    jwt:
      private-key-pem: test-private
      public-key-pem: test-public
      kid: test-kid
      issuer: test-issuer
      audience: test-audience
    pepper:
      refresh-token: test-refresh-pepper
      api-key: test-api-key-pepper
