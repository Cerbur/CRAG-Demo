  "components": {
    "parameters": {
      "AuthorizationHeader": {
        "name": "Authorization",
        "in": "header",
        "required": true,
        "schema": { "type": "string" },
        "description": "Access JWT，格式 `Bearer <jwt>`。Access JWT 只进响应体，由客户端后续作为 Bearer 使用。"
      },
      "OriginHeader": {
        "name": "Origin",
        "in": "header",
        "required": false,
        "schema": { "type": "string" },
        "description": "refresh/logout 校验同站 Origin/Referer，不开放通配 CORS。"
      },
      "RefererHeader": {
        "name": "Referer",
        "in": "header",
        "required": false,
        "schema": { "type": "string" },
        "description": "Origin 缺失时回退到 Referer 同站校验。"
      },
      "RefreshCookieParam": {
        "name": "refresh_token",
        "in": "cookie",
        "required": true,
        "schema": { "type": "string" },
        "description": "HttpOnly Cookie 携带的 Refresh Token；由服务端在 register/login/refresh 时通过 Set-Cookie 下发。"
      },
      "PageSize": {
        "name": "pageSize",
        "in": "query",
        "required": false,
        "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 20 },
        "description": "每页大小，1–100，默认 20。"
      },
      "PageToken": {
        "name": "pageToken",
        "in": "query",
        "required": false,
        "schema": { "type": "string", "default": "" },
        "description": "分页游标（上一页 nextPageToken）；首次为空。"
      },
      "TenantIdPath": {
        "name": "tenantId",
        "in": "path",
        "required": true,
        "schema": { "type": "string", "pattern": "^[0-9]+$" },
        "description": "Tenant ID，十进制字符串。"
      },
      "KnowledgeBaseIdPath": {
        "name": "knowledgeBaseId",
        "in": "path",
        "required": true,
        "schema": { "type": "string", "pattern": "^[0-9]+$" },
        "description": "KnowledgeBase ID，十进制字符串。"
      },
      "DocIdPath": {
        "name": "docId",
        "in": "path",
        "required": true,
        "schema": { "type": "string", "pattern": "^[0-9]+$" },
        "description": "Document ID，十进制字符串。"
      },
      "UserIdPath": {
        "name": "userId",
        "in": "path",
        "required": true,
        "schema": { "type": "string", "pattern": "^[0-9]+$" },
        "description": "User ID，十进制字符串。"
      },
      "ApiKeyIdPath": {
        "name": "apiKeyId",
        "in": "path",
        "required": true,
        "schema": { "type": "string", "pattern": "^[0-9]+$" },
        "description": "API Key ID，十进制字符串。"
      }
    },
    "headers": {
      "RefreshCookie": {
        "description": "HttpOnly + Secure + SameSite=Lax + Path=/api/v1/auth 的 Refresh Token Cookie。本地 HTTP 通过 crag.console.cookie.secure=false 显式关闭 Secure。Max-Age 由 crag.console.cookie.refresh-ttl 决定。",
        "schema": {
          "type": "string",
          "example": "refresh_token=<PLACEHOLDER_REFRESH_TOKEN>; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=2592000"
        }
      },
      "RefreshCookieCleared": {
        "description": "logout/失败时以 Max-Age=0、value 空清除 refresh_token Cookie，其余属性保持一致。",
        "schema": {
          "type": "string",
          "example": "refresh_token=; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=0"
        }
      }
    },
    "responses": {
      "ValidationError": {
        "description": "400 — Bean Validation 校验失败（40001 VALIDATION_ERROR）。敏感字段（密码/Token/Key）不回显 rejectedValue。",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ErrorDetailEnvelope" },
            "example": {
              "success": false,
              "code": 40001,
              "result": {
                "message": "Validation failed",
                "traceId": "9c1f...",
                "reason": "VALIDATION_ERROR",
                "retryable": false,
                "fieldErrors": [
                  { "field": "name", "message": "name must be 1-128 chars", "rejectedValue": null }
                ]
              }
            }
          }
        }
      },
      "InvalidArgument": {
        "description": "400 — 程序化非法参数（40002 INVALID_ARGUMENT），例如 pageSize 越界。",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ErrorDetailEnvelope" },
            "example": {
              "success": false,
              "code": 40002,
              "result": {
                "message": "Invalid argument",
                "traceId": "9c1f...",
                "reason": "INVALID_ARGUMENT",
                "retryable": false,
                "fieldErrors": []
              }
            }
          }
        }
      },
      "Unauthenticated": {
        "description": "401 — 缺少或无效凭证（40101 UNAUTHENTICATED）。",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ErrorDetailEnvelope" },
            "example": {
              "success": false,
              "code": 40101,
              "result": {
                "message": "Unauthenticated",
                "traceId": "9c1f...",
                "reason": "UNAUTHENTICATED",
                "retryable": false,
                "fieldErrors": []
              }
            }
          }
        }
      },
      "InvalidCredentials": {
        "description": "401 — 登录/Refresh 失败（40102 INVALID_CREDENTIALS）。具体原因不通过 message/reason 泄漏。",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ErrorDetailEnvelope" },
            "example": {
              "success": false,
              "code": 40102,
              "result": {
                "message": "Authentication failed",
                "traceId": "9c1f...",
                "reason": "INVALID_CREDENTIALS",
                "retryable": false,
                "fieldErrors": []
              }
            }
          }
        }
      },
      "Forbidden": {
        "description": "403 — 已认证但无权（40301 FORBIDDEN）或跨站 Origin（reason=CROSS_SITE_ORIGIN）。",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ErrorDetailEnvelope" },
            "example": {
              "success": false,
              "code": 40301,
              "result": {
                "message": "Forbidden",
                "traceId": "9c1f...",
                "reason": "FORBIDDEN",
                "retryable": false,
                "fieldErrors": []
              }
            }
          }
        }
      },
      "NotFound": {
        "description": "404 — 资源不存在（40401 NOT_FOUND）。跨租户/跨 KB 统一 404，不泄漏存在性。",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ErrorDetailEnvelope" },
            "example": {
              "success": false,
              "code": 40401,
              "result": {
                "message": "Resource not found",
                "traceId": "9c1f...",
                "reason": "NOT_FOUND",
                "retryable": false,
                "fieldErrors": []
              }
            }
          }
        }
      },
      "Conflict": {
        "description": "409 — 资源冲突（40901 CONFLICT）：状态冲突、版本冲突或最后 OWNER 保护。",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ErrorDetailEnvelope" },
            "example": {
              "success": false,
              "code": 40901,
              "result": {
                "message": "Conflict",
                "traceId": "9c1f...",
                "reason": "CONFLICT",
                "retryable": false,
                "fieldErrors": []
              }
            }
          }
        }
      },
      "IngestionRetryNotAllowed": {
        "description": "409 — 摄取不可重试（40902 INGESTION_RETRY_NOT_ALLOWED）：失败分类不可重试或达到次数上限。",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ErrorDetailEnvelope" },
            "example": {
              "success": false,
              "code": 40902,
              "result": {
                "message": "Ingestion retry not allowed",
                "traceId": "9c1f...",
                "reason": "INGESTION_RETRY_NOT_ALLOWED",
                "retryable": false,
                "fieldErrors": []
              }
            }
          }
        }
      },
      "UploadTooLarge": {
        "description": "413 — 上传超过 10 MiB 上限（41301 UPLOAD_TOO_LARGE）。",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ErrorDetailEnvelope" },
            "example": {
              "success": false,
              "code": 41301,
              "result": {
                "message": "Upload too large",
                "traceId": "9c1f...",
                "reason": "UPLOAD_TOO_LARGE",
                "retryable": false,
                "fieldErrors": []
              }
            }
          }
        }
      },
      "UnsupportedMediaType": {
        "description": "415 — 不支持的文件扩展名或 MIME（41501 UNSUPPORTED_MEDIA_TYPE）。",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ErrorDetailEnvelope" },
            "example": {
              "success": false,
              "code": 41501,
              "result": {
                "message": "Upload rejected",
                "traceId": "9c1f...",
                "reason": "UNSUPPORTED_EXTENSION",
                "retryable": false,
                "fieldErrors": []
              }
            }
          }
        }
      },
      "DownstreamUnavailable": {
        "description": "503 — 下游 Access/Knowledge 不可用（50301 DOWNSTREAM_UNAVAILABLE），可安全重试。",
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ErrorDetailEnvelope" },
            "example": {
              "success": false,
              "code": 50301,
              "result": {
                "message": "Downstream unavailable",
                "traceId": "9c1f...",
                "reason": "DOWNSTREAM_UNAVAILABLE",
                "retryable": true,
                "fieldErrors": []
              }
            }
          }
        }
      }
    },
    "schemas": {
      "RegisterRequest": {
        "type": "object",
        "required": ["nickname", "username", "password"],
        "properties": {
          "nickname": { "type": "string", "minLength": 1, "maxLength": 64 },
          "username": { "type": "string", "minLength": 3, "maxLength": 32 },
          "password": { "type": "string", "minLength": 12, "maxLength": 128, "format": "password" }
        }
      },
      "LoginRequest": {
        "type": "object",
        "required": ["username", "password"],
        "properties": {
          "username": { "type": "string" },
          "password": { "type": "string", "format": "password" }
        }
      },
      "AddMemberRequest": {
        "type": "object",
        "required": ["username"],
        "properties": {
          "username": { "type": "string", "minLength": 3, "maxLength": 32 }
        }
      },
      "ChangeMemberRoleRequest": {
        "type": "object",
        "required": ["role"],
        "properties": {
          "role": { "type": "string", "enum": ["OWNER", "MEMBER"] }
        }
      },
      "CreateKnowledgeBaseRequest": {
        "type": "object",
        "required": ["name"],
        "properties": {
          "name": { "type": "string", "minLength": 1, "maxLength": 128 }
        }
      },
      "CreateApiKeyRequest": {
        "type": "object",
        "required": ["name"],
        "properties": {
          "name": { "type": "string", "minLength": 1, "maxLength": 64 },
          "ttlSeconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 31536000,
            "description": "有效期秒数；0/省略使用 Access 默认（90 天），上限 365 天，禁止永不过期。"
          }
        }
      },
      "AuthResponse": {
        "type": "object",
        "required": ["accessToken", "accessExpiresAt", "user"],
        "properties": {
          "accessToken": { "type": "string", "description": "Access JWT（不含 Refresh Token）" },
          "accessExpiresAt": { "type": "string", "format": "date-time", "description": "Access JWT 过期时间，RFC 3339 UTC" },
          "user": { "$ref": "#/components/schemas/UserResponse" },
          "defaultTenant": { "oneOf": [{ "$ref": "#/components/schemas/TenantSummaryResponse" }, { "type": "null" }], "description": "默认 Tenant；仅 register 非空，login/refresh 为 null" }
        }
      },
      "AuthResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/AuthResponse" } } }
        ]
      },
      "UserResponse": {
        "type": "object",
        "required": ["userId", "nickname"],
        "properties": {
          "userId": { "type": "string", "pattern": "^[0-9]+$" },
          "nickname": { "type": "string" }
        }
      },
      "UserResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/UserResponse" } } }
        ]
      },
      "TenantSummaryResponse": {
        "type": "object",
        "required": ["tenantId", "name", "role"],
        "properties": {
          "tenantId": { "type": "string", "pattern": "^[0-9]+$" },
          "name": { "type": "string" },
          "role": { "type": "string", "enum": ["OWNER", "MEMBER"] }
        }
      },
      "TenantListResponse": {
        "type": "object",
        "required": ["items", "nextPageToken"],
        "properties": {
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/TenantSummaryResponse" } },
          "nextPageToken": { "type": "string" }
        }
      },
      "TenantListResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/TenantListResponse" } } }
        ]
      },
      "MemberResponse": {
        "type": "object",
        "required": ["userId", "nickname", "role", "status", "createdAt", "updatedAt"],
        "properties": {
          "userId": { "type": "string", "pattern": "^[0-9]+$" },
          "nickname": { "type": "string", "description": "成员展示名。list 由 Access 批量补齐；add/change-role/remove 由单用户 GetUserProfile 解析" },
          "role": { "type": "string", "enum": ["OWNER", "MEMBER"] },
          "status": { "type": "string", "enum": ["ACTIVE", "REMOVED"] },
          "createdAt": { "type": "string", "format": "date-time" },
          "updatedAt": { "type": "string", "format": "date-time" }
        }
      },
      "MemberResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/MemberResponse" } } }
        ]
      },
      "MembersListResponse": {
        "type": "object",
        "required": ["items", "nextPageToken"],
        "properties": {
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/MemberResponse" } },
          "nextPageToken": { "type": "string" }
        }
      },
      "MembersListResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/MembersListResponse" } } }
        ]
      },
      "KnowledgeBaseResponse": {
        "type": "object",
        "required": ["knowledgeBaseId", "tenantId", "name", "apiKeyReady", "createdAt", "updatedAt"],
        "properties": {
          "knowledgeBaseId": { "type": "string", "pattern": "^[0-9]+$" },
          "tenantId": { "type": "string", "pattern": "^[0-9]+$" },
          "name": { "type": "string" },
          "apiKeyReady": { "type": "boolean", "description": "Access Scope 是否就绪；建库部分成功为 false" },
          "createdAt": { "type": "string", "format": "date-time" },
          "updatedAt": { "type": "string", "format": "date-time" }
        }
      },
      "KnowledgeBaseResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/KnowledgeBaseResponse" } } }
        ]
      },
      "KnowledgeBaseListResponse": {
        "type": "object",
        "required": ["items", "nextPageToken"],
        "properties": {
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/KnowledgeBaseResponse" } },
          "nextPageToken": { "type": "string" }
        }
      },
      "KnowledgeBaseListResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/KnowledgeBaseListResponse" } } }
        ]
      },
      "DocumentResponse": {
        "type": "object",
        "required": ["docId", "knowledgeBaseId", "originalFilename", "fileType", "sizeBytes", "ingestionStatus", "operationVersion", "attempt", "failureCategory", "failureMessage", "retryable", "startedAt", "completedAt"],
        "properties": {
          "docId": { "type": "string", "pattern": "^[0-9]+$" },
          "knowledgeBaseId": { "type": "string", "pattern": "^[0-9]+$" },
          "originalFilename": { "type": "string" },
          "fileType": { "type": "string", "enum": ["TXT", "MARKDOWN"] },
          "sizeBytes": { "type": "integer", "format": "int64" },
          "ingestionStatus": { "type": "string", "enum": ["PENDING", "PROCESSING", "READY", "FAILED"] },
          "operationVersion": { "type": "string", "pattern": "^[0-9]+$" },
          "attempt": { "type": "integer" },
          "failureCategory": { "type": ["string", "null"] },
          "failureMessage": { "type": ["string", "null"] },
          "retryable": { "type": "boolean" },
          "startedAt": { "type": ["string", "null"], "format": "date-time" },
          "completedAt": { "type": ["string", "null"], "format": "date-time" }
        }
      },
      "DocumentResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/DocumentResponse" } } }
        ]
      },
      "DocumentListResponse": {
        "type": "object",
        "required": ["items", "nextPageToken"],
        "properties": {
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/DocumentResponse" } },
          "nextPageToken": { "type": "string" }
        }
      },
      "DocumentListResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/DocumentListResponse" } } }
        ]
      },
      "ApiKeyResponse": {
        "type": "object",
        "required": ["apiKeyId", "knowledgeBaseId", "name", "status", "keyPrefix", "createdAt", "expiresAt"],
        "properties": {
          "apiKeyId": { "type": "string", "pattern": "^[0-9]+$" },
          "knowledgeBaseId": { "type": "string", "pattern": "^[0-9]+$" },
          "name": { "type": "string" },
          "status": { "type": "string", "enum": ["ACTIVE", "DISABLED", "REVOKED", "EXPIRED"] },
          "keyPrefix": { "type": "string", "description": "可检索前缀，不含完整秘密" },
          "createdAt": { "type": "string", "format": "date-time" },
          "expiresAt": { "type": ["string", "null"], "format": "date-time" }
        }
      },
      "ApiKeyResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/ApiKeyResponse" } } }
        ]
      },
      "ApiKeyListResponse": {
        "type": "object",
        "required": ["items", "nextPageToken"],
        "properties": {
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/ApiKeyResponse" } },
          "nextPageToken": { "type": ["string", "null"] }
        }
      },
      "ApiKeyListResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/ApiKeyListResponse" } } }
        ]
      },
      "CreatedApiKeyResponse": {
        "type": "object",
        "required": ["apiKeyId", "knowledgeBaseId", "name", "completeKey", "expiresAt"],
        "properties": {
          "apiKeyId": { "type": "string", "pattern": "^[0-9]+$" },
          "knowledgeBaseId": { "type": "string", "pattern": "^[0-9]+$" },
          "name": { "type": "string" },
          "completeKey": { "type": "string", "description": "完整 Key，仅 create/rotate 一次返回；此后不可再读" },
          "expiresAt": { "type": ["string", "null"], "format": "date-time" }
        }
      },
      "CreatedApiKeyResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/CreatedApiKeyResponse" } } }
        ]
      },
      "EnvelopeBase": {
        "type": "object",
        "required": ["success", "code"],
        "properties": {
          "success": { "type": "boolean" },
          "code": { "type": "integer", "description": "0 表示成功；错误码见 docs/api/README.md 业务码表" },
          "result": { "description": "成功时的业务负载；失败时为 ErrorDetail 或 null" }
        }
      },
      "EmptyResponseEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "type": "null" } } }
        ]
      },
      "ErrorDetail": {
        "type": "object",
        "required": ["message", "traceId", "reason", "retryable", "fieldErrors"],
        "properties": {
          "message": { "type": "string", "description": "面向客户端的安全稳定说明" },
          "traceId": { "type": "string" },
          "reason": { "type": "string", "description": "稳定机器可读原因标签" },
          "retryable": { "type": "boolean" },
          "fieldErrors": {
            "type": "array",
            "items": {
              "type": "object",
              "required": ["field", "message", "rejectedValue"],
              "properties": {
                "field": { "type": "string" },
                "message": { "type": "string" },
                "rejectedValue": { "description": "非敏感诊断回显；敏感字段为 null" }
              }
            }
          }
        }
      },
      "ErrorDetailEnvelope": {
        "allOf": [
          { "$ref": "#/components/schemas/EnvelopeBase" },
          { "type": "object", "properties": { "result": { "$ref": "#/components/schemas/ErrorDetail" } } }
        ]
      }
    }
  },
  "x-crag-implementation": {
    "description": "Controller→路由清单，由 scripts/validate_openapi.py 校验与实现一致。新增/删除路由必须同步这里与 OpenAPI paths。",
    "controller-routes": [
      {
        "controller": "ai.cerbur.crag.console.auth.controller.AuthController",
        "routes": [
          { "method": "POST", "path": "/api/v1/auth/register" },
          { "method": "POST", "path": "/api/v1/auth/login" },
          { "method": "POST", "path": "/api/v1/auth/refresh" },
          { "method": "POST", "path": "/api/v1/auth/logout" },
          { "method": "GET", "path": "/api/v1/auth/me" }
        ]
      },
      {
        "controller": "ai.cerbur.crag.console.tenant.controller.TenantController",
        "routes": [
          { "method": "GET", "path": "/api/v1/tenants" }
        ]
      },
      {
        "controller": "ai.cerbur.crag.console.membership.controller.MembershipController",
        "routes": [
          { "method": "GET", "path": "/api/v1/tenants/{tenantId}/members" },
          { "method": "POST", "path": "/api/v1/tenants/{tenantId}/members" },
          { "method": "PATCH", "path": "/api/v1/tenants/{tenantId}/members/{userId}" },
          { "method": "DELETE", "path": "/api/v1/tenants/{tenantId}/members/{userId}" }
        ]
      },
      {
        "controller": "ai.cerbur.crag.console.knowledge.controller.KnowledgeBaseController",
        "routes": [
          { "method": "GET", "path": "/api/v1/tenants/{tenantId}/knowledge-bases" },
          { "method": "POST", "path": "/api/v1/tenants/{tenantId}/knowledge-bases" },
          { "method": "GET", "path": "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}" }
        ]
      },
      {
        "controller": "ai.cerbur.crag.console.document.controller.DocumentController",
        "routes": [
          { "method": "GET", "path": "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}/documents" },
          { "method": "POST", "path": "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}/documents" },
          { "method": "GET", "path": "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}/documents/{docId}" },
          { "method": "POST", "path": "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}/documents/{docId}/ingestion/retry" }
        ]
      },
      {
        "controller": "ai.cerbur.crag.console.apikey.controller.ApiKeyController",
        "routes": [
          { "method": "GET", "path": "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}/api-keys" },
          { "method": "POST", "path": "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}/api-keys" },
          { "method": "GET", "path": "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}/api-keys/{apiKeyId}" },
          { "method": "POST", "path": "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}/api-keys/{apiKeyId}/disable" },
          { "method": "POST", "path": "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}/api-keys/{apiKeyId}/enable" },
          { "method": "POST", "path": "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}/api-keys/{apiKeyId}/rotate" },
          { "method": "POST", "path": "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}/api-keys/{apiKeyId}/revoke" }
        ]
      }
    ]
  }
}
