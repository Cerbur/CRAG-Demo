{
  "openapi": "3.1.0",
  "info": {
    "title": "CRAG-Demo Console API",
    "version": "1.0.0",
    "description": "Console 管理面正式 HTTP API（plan_21/21.6–21.9）。前端通过 Access JWT 完成认证，管理 Tenant、Membership、KnowledgeBase、Document 摄取生命周期与 API Key。所有响应包装为统一 Response<T>。详细中文指南见 docs/api/README.md。"
  },
  "servers": [
    { "url": "http://localhost:8080", "description": "本地 console-api 入口" }
  ],
  "tags": [
    { "name": "Auth", "description": "认证、Refresh Cookie、当前用户" },
    { "name": "Tenant", "description": "当前用户的有效 Tenant 列表" },
    { "name": "Membership", "description": "Tenant 成员管理" },
    { "name": "KnowledgeBase", "description": "KnowledgeBase 与建库 Scope" },
    { "name": "Document", "description": "Document 上传、摄取状态与重试" },
    { "name": "ApiKey", "description": "单 KnowledgeBase 的 API Key 生命周期" }
  ],
  "paths": {
    "/api/v1/auth/register": {
      "post": {
        "tags": ["Auth"],
        "operationId": "register",
        "summary": "注册 User/Account/默认 Tenant，返回 Access JWT 并设置 Refresh Cookie",
        "description": "创建用户、登录账号、默认 Tenant 与 OWNER Membership。响应体只含 Access JWT；完整 Refresh Token 通过 HttpOnly Cookie 下发。register 额外返回默认 Tenant；login 后客户端通过 Tenant 列表恢复上下文。",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/RegisterRequest" },
              "example": {
                "nickname": "alice",
                "username": "alice",
                "password": "<PLACEHOLDER_PASSWORD>"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "注册成功；响应体含 Access JWT，Set-Cookie 含 HttpOnly Refresh Token",
            "headers": {
              "Set-Cookie": { "$ref": "#/components/headers/RefreshCookie" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/AuthResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": {
                    "accessToken": "<PLACEHOLDER_ACCESS_JWT>",
                    "accessExpiresAt": "2026-06-29T12:00:00Z",
                    "user": { "userId": "1001", "nickname": "alice" },
                    "defaultTenant": {
                      "tenantId": "2001",
                      "name": "alice 的默认租户",
                      "role": "OWNER"
                    }
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ValidationError" },
          "401": { "$ref": "#/components/responses/InvalidCredentials" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      }
    },
    "/api/v1/auth/login": {
      "post": {
        "tags": ["Auth"],
        "operationId": "login",
        "summary": "登录并创建 Session Family",
        "description": "验证凭据并签发新 Access JWT；完整 Refresh Token 通过 HttpOnly Cookie 下发。响应体不含 Refresh Token；defaultTenant 为 null，客户端通过 GET /api/v1/tenants 恢复工作上下文。",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/LoginRequest" },
              "example": {
                "username": "alice",
                "password": "<PLACEHOLDER_PASSWORD>"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "登录成功",
            "headers": {
              "Set-Cookie": { "$ref": "#/components/headers/RefreshCookie" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/AuthResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": {
                    "accessToken": "<PLACEHOLDER_ACCESS_JWT>",
                    "accessExpiresAt": "2026-06-29T12:00:00Z",
                    "user": { "userId": "1001", "nickname": "alice" },
                    "defaultTenant": null
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ValidationError" },
          "401": { "$ref": "#/components/responses/InvalidCredentials" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      }
    },
    "/api/v1/auth/refresh": {
      "post": {
        "tags": ["Auth"],
        "operationId": "refresh",
        "summary": "从 Cookie 轮换 Refresh Token，返回新 Access JWT",
        "description": "校验同站 Origin/Referer；从 refresh_token Cookie 读取并轮换 Refresh Token（旧 Token 撤销，下发新 Cookie）。不读取请求体。缺 Cookie 返回 401，缺/跨站 Origin 返回 403。",
        "parameters": [
          { "$ref": "#/components/parameters/OriginHeader" },
          { "$ref": "#/components/parameters/RefererHeader" },
          { "$ref": "#/components/parameters/RefreshCookieParam" }
        ],
        "responses": {
          "200": {
            "description": "刷新成功；Set-Cookie 下发轮换后的 Refresh Token",
            "headers": {
              "Set-Cookie": { "$ref": "#/components/headers/RefreshCookie" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/AuthResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": {
                    "accessToken": "<PLACEHOLDER_ACCESS_JWT>",
                    "accessExpiresAt": "2026-06-29T12:15:00Z",
                    "user": { "userId": "1001", "nickname": "alice" },
                    "defaultTenant": null
                  }
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthenticated" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "tags": ["Auth"],
        "operationId": "logout",
        "summary": "通过 Cookie 撤销 Session Family 并清除 Cookie",
        "description": "校验同站 Origin/Referer。无论 Access 结果如何都在 finally 中清除本地 Cookie。不强制 Bearer（依赖 Cookie）；若请求携带有效 Principal 则一并撤销 Session Family。",
        "parameters": [
          { "$ref": "#/components/parameters/OriginHeader" },
          { "$ref": "#/components/parameters/RefererHeader" },
          { "$ref": "#/components/parameters/RefreshCookieParam" }
        ],
        "responses": {
          "200": {
            "description": "登出成功；Set-Cookie 以 Max-Age=0 清除 refresh_token",
            "headers": {
              "Set-Cookie": { "$ref": "#/components/headers/RefreshCookieCleared" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/EmptyResponseEnvelope" },
                "example": { "success": true, "code": 0, "result": null }
              }
            }
          },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      }
    },
    "/api/v1/auth/me": {
      "get": {
        "tags": ["Auth"],
        "operationId": "getCurrentUser",
        "summary": "返回当前用户安全投影",
        "description": "通过 Bearer filter 注入的 ConsolePrincipal 解析当前用户；缺 Principal 返回 401。",
        "parameters": [{ "$ref": "#/components/parameters/AuthorizationHeader" }],
        "responses": {
          "200": {
            "description": "当前用户安全投影",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/UserResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": { "userId": "1001", "nickname": "alice" }
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthenticated" }
        }
      }
    },
    "/api/v1/tenants": {
      "get": {
        "tags": ["Tenant"],
        "operationId": "listTenants",
        "summary": "当前用户的有效 Tenant 与角色列表",
        "description": "actor userId 只来自 Bearer filter 注入的 ConsolePrincipal，不读取请求体或查询参数中的 actor。分页使用 tenantId 游标。",
        "parameters": [
          { "$ref": "#/components/parameters/AuthorizationHeader" },
          { "$ref": "#/components/parameters/PageSize" },
          { "$ref": "#/components/parameters/PageToken" }
        ],
        "responses": {
          "200": {
            "description": "Tenant 列表分页",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/TenantListResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": {
                    "items": [
                      {
                        "tenantId": "2001",
                        "name": "alice 的默认租户",
                        "role": "OWNER"
                      }
                    ],
                    "nextPageToken": ""
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/InvalidArgument" },
          "401": { "$ref": "#/components/responses/Unauthenticated" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      }
    },
    "/api/v1/tenants/{tenantId}/members": {
      "get": {
        "tags": ["Membership"],
        "operationId": "listMembers",
        "summary": "成员列表",
        "description": "actor userId 只来自 ConsolePrincipal。nickname 来自 Access list 批量补齐的 proto Membership.nickname（plan_21/21.7 已修复）；单成员命令（add/change-role/remove）通过单用户 GetUserProfile 解析 nickname。MEMBER 不能管理（Access PERMISSION_DENIED → 403）；跨租户不可见（NOT_FOUND → 404，不泄漏）。",
        "parameters": [
          { "$ref": "#/components/parameters/AuthorizationHeader" },
          { "$ref": "#/components/parameters/TenantIdPath" },
          { "$ref": "#/components/parameters/PageSize" },
          { "$ref": "#/components/parameters/PageToken" }
        ],
        "responses": {
          "200": {
            "description": "成员列表分页（nickname 来自 Access list 批量补齐的 proto 字段）",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/MembersListResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": {
                    "items": [
                      {
                        "userId": "1001",
                        "nickname": "alice",
                        "role": "OWNER",
                        "status": "ACTIVE",
                        "createdAt": "2026-06-29T10:00:00Z",
                        "updatedAt": "2026-06-29T10:00:00Z"
                      }
                    ],
                    "nextPageToken": ""
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/InvalidArgument" },
          "401": { "$ref": "#/components/responses/Unauthenticated" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      },
      "post": {
        "tags": ["Membership"],
        "operationId": "addMember",
        "summary": "按 Username 添加已注册用户",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/AddMemberRequest" },
              "example": { "username": "bob" }
            }
          }
        },
        "parameters": [
          { "$ref": "#/components/parameters/AuthorizationHeader" },
          { "$ref": "#/components/parameters/TenantIdPath" }
        ],
        "responses": {
          "200": {
            "description": "添加成功（nickname 由单用户 GetUserProfile 解析）",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/MemberResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": {
                    "userId": "1002",
                    "nickname": "bob",
                    "role": "MEMBER",
                    "status": "ACTIVE",
                    "createdAt": "2026-06-29T11:00:00Z",
                    "updatedAt": "2026-06-29T11:00:00Z"
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ValidationError" },
          "401": { "$ref": "#/components/responses/Unauthenticated" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      }
    },
    "/api/v1/tenants/{tenantId}/members/{userId}": {
      "patch": {
        "tags": ["Membership"],
        "operationId": "changeMemberRole",
        "summary": "调整 OWNER/MEMBER 角色",
        "description": "最后 OWNER 降级由 Access FAILED_PRECONDITION 保护，返回 409。",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/ChangeMemberRoleRequest" },
              "example": { "role": "MEMBER" }
            }
          }
        },
        "parameters": [
          { "$ref": "#/components/parameters/AuthorizationHeader" },
          { "$ref": "#/components/parameters/TenantIdPath" },
          { "$ref": "#/components/parameters/UserIdPath" }
        ],
        "responses": {
          "200": {
            "description": "角色调整成功",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/MemberResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": {
                    "userId": "1002",
                    "nickname": "bob",
                    "role": "OWNER",
                    "status": "ACTIVE",
                    "createdAt": "2026-06-29T11:00:00Z",
                    "updatedAt": "2026-06-29T11:30:00Z"
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ValidationError" },
          "401": { "$ref": "#/components/responses/Unauthenticated" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      },
      "delete": {
        "tags": ["Membership"],
        "operationId": "removeMember",
        "summary": "移除成员并保护最后 OWNER",
        "description": "返回 HTTP 200 与已变更 REMOVED 投影的 Response（计划约定）。最后 OWNER 移除返回 409。",
        "parameters": [
          { "$ref": "#/components/parameters/AuthorizationHeader" },
          { "$ref": "#/components/parameters/TenantIdPath" },
          { "$ref": "#/components/parameters/UserIdPath" }
        ],
        "responses": {
          "200": {
            "description": "移除成功；返回 status=REMOVED 的成员投影",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/MemberResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": {
                    "userId": "1002",
                    "nickname": "bob",
                    "role": "MEMBER",
                    "status": "REMOVED",
                    "createdAt": "2026-06-29T11:00:00Z",
                    "updatedAt": "2026-06-29T12:00:00Z"
                  }
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthenticated" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      }
    },
    "/api/v1/tenants/{tenantId}/knowledge-bases": {
      "get": {
        "tags": ["KnowledgeBase"],
        "operationId": "listKnowledgeBases",
        "summary": "列出 Tenant 的 KnowledgeBase",
        "description": "list 先 Authorize VIEW；跨租户/不存在统一 404，不泄漏存在性。列表项的 apiKeyReady 由 Access Scope 查询补齐（GetScope ACTIVE 视为就绪）；查询失败时为 false。",
        "parameters": [
          { "$ref": "#/components/parameters/AuthorizationHeader" },
          { "$ref": "#/components/parameters/TenantIdPath" },
          { "$ref": "#/components/parameters/PageSize" },
          { "$ref": "#/components/parameters/PageToken" }
        ],
        "responses": {
          "200": {
            "description": "KnowledgeBase 列表分页",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/KnowledgeBaseListResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": {
                    "items": [
                      {
                        "knowledgeBaseId": "3001",
                        "tenantId": "2001",
                        "name": "产品文档",
                        "apiKeyReady": true,
                        "createdAt": "2026-06-29T09:00:00Z",
                        "updatedAt": "2026-06-29T09:00:00Z"
                      }
                    ],
                    "nextPageToken": ""
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/InvalidArgument" },
          "401": { "$ref": "#/components/responses/Unauthenticated" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      },
      "post": {
        "tags": ["KnowledgeBase"],
        "operationId": "createKnowledgeBase",
        "summary": "创建 KnowledgeBase 并确保 Access Scope",
        "description": "编排顺序：Authorize → Knowledge Create → Access EnsureScope。建库返回 HTTP 201；Scope 暂时失败仍返回 201 与 apiKeyReady=false（不二次 create），由 Access KB_CREATED consumer + 后续 EnsureScope 兜底修复。",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CreateKnowledgeBaseRequest" },
              "example": { "name": "产品文档" }
            }
          }
        },
        "parameters": [
          { "$ref": "#/components/parameters/AuthorizationHeader" },
          { "$ref": "#/components/parameters/TenantIdPath" }
        ],
        "responses": {
          "201": {
            "description": "建库成功（含 Scope 部分成功 apiKeyReady=false）",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/KnowledgeBaseResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": {
                    "knowledgeBaseId": "3001",
                    "tenantId": "2001",
                    "name": "产品文档",
                    "apiKeyReady": true,
                    "createdAt": "2026-06-29T09:00:00Z",
                    "updatedAt": "2026-06-29T09:00:00Z"
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ValidationError" },
          "401": { "$ref": "#/components/responses/Unauthenticated" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      }
    },
    "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}": {
      "get": {
        "tags": ["KnowledgeBase"],
        "operationId": "getKnowledgeBase",
        "summary": "KnowledgeBase 详情",
        "description": "先 Authorize VIEW；跨租户/不存在统一 404。",
        "parameters": [
          { "$ref": "#/components/parameters/AuthorizationHeader" },
          { "$ref": "#/components/parameters/TenantIdPath" },
          { "$ref": "#/components/parameters/KnowledgeBaseIdPath" }
        ],
        "responses": {
          "200": {
            "description": "KnowledgeBase 详情",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/KnowledgeBaseResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": {
                    "knowledgeBaseId": "3001",
                    "tenantId": "2001",
                    "name": "产品文档",
                    "apiKeyReady": true,
                    "createdAt": "2026-06-29T09:00:00Z",
                    "updatedAt": "2026-06-29T09:00:00Z"
                  }
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthenticated" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      }
    },
    "/api/v1/tenants/{tenantId}/knowledge-bases/{knowledgeBaseId}/documents": {
      "get": {
        "tags": ["Document"],
        "operationId": "listDocuments",
        "summary": "Document 列表与摄取状态",
        "description": "先 KB 归属 Authorize VIEW（跨租户/不存在统一 404）。",
        "parameters": [
          { "$ref": "#/components/parameters/AuthorizationHeader" },
          { "$ref": "#/components/parameters/TenantIdPath" },
          { "$ref": "#/components/parameters/KnowledgeBaseIdPath" },
          { "$ref": "#/components/parameters/PageSize" },
          { "$ref": "#/components/parameters/PageToken" }
        ],
        "responses": {
          "200": {
            "description": "Document 列表分页",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/DocumentListResponseEnvelope" },
                "example": {
                  "success": true,
                  "code": 0,
                  "result": {
                    "items": [
                      {
                        "docId": "4001",
                        "knowledgeBaseId": "3001",
                        "originalFilename": "intro.txt",
                        "fileType": "TXT",
                        "sizeBytes": 128,
                        "ingestionStatus": "READY",
                        "operationVersion": "1",
                        "attempt": 1,
                        "failureCategory": "",
                        "failureMessage": "",
                        "retryable": false,
                        "startedAt": "2026-06-29T09:01:00Z",
                        "completedAt": "2026-06-29T09:01:30Z"
                      }
                    ],
                    "nextPageToken": ""
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/InvalidArgument" },
          "401": { "$ref": "#/components/responses/Unauthenticated" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "503": { "$ref": "#/components/responses/DownstreamUnavailable" }
        }
      },
      "post": {
        "tags": ["Document"],
        "operationId": "uploadDocument",
        "summary": "单文件 multipart 上传",
        "description": "先 KB 归属 Authorize VIEW（跨租户/不存在统一 404）。只接受单 .txt 或 .md 文件、10 MiB 上限、UTF-8；Console 计算 size/SHA-256 后 metadata-first 分片发送 Knowledge。成功返回 HTTP 202 与 PENDING；底层 Document 在 Knowledge 内 201。不下载或删除文件。",
        "parameters": [
          { "$ref": "#/components/parameters/AuthorizationHeader" },
          { "$ref": "#/components/parameters/TenantIdPath" },
          { "$ref": "#/components/parameters/KnowledgeBaseIdPath" }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
