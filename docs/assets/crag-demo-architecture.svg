<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">CRAG-Demo 多租户知识平台当前架构</title>
  <desc id="desc">管理控制台和外部调用方经 Console API 与 Open API 进入 Access、Knowledge、RAG 三个领域服务。服务通过 gRPC 同步调用，通过 Redis Streams 传递可靠事件，并分别拥有 PostgreSQL Schema。RAG 使用 Python Sidecar 完成向量化和重排，使用 Stub 或 DeepSeek 生成答案。</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#edf3f9"/>
    </linearGradient>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#16834a"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 40px; font-weight: 800; fill: #fff; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #dbeafe; }
      .section { font-size: 20px; font-weight: 800; fill: #1e3a5f; }
      .card-title { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .card-title-sm { font-size: 18px; font-weight: 800; fill: #0f172a; }
      .text { font-size: 14px; font-weight: 500; fill: #334155; }
      .small { font-size: 12px; font-weight: 500; fill: #475569; }
      .mini-title { font-size: 14px; font-weight: 800; fill: #1e3a5f; }
      .label-blue { font-size: 12px; font-weight: 700; fill: #1d4ed8; }
      .label-orange { font-size: 12px; font-weight: 700; fill: #b45309; }
      .label-green { font-size: 12px; font-weight: 700; fill: #137a42; }
      .shell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; }
      .actor { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .gateway { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .access { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .knowledge { fill: #ecfdf5; stroke: #16834a; stroke-width: 2; }
      .rag { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
      .mini { fill: #fff; stroke: #cbd5e1; stroke-width: 1.1; }
      .schema { fill: #f0fdf4; stroke: #22a35a; stroke-width: 1.5; }
      .infra { fill: #fff; stroke: #64748b; stroke-width: 1.5; }
      .pill { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1; }
      .pill-text { font-size: 11px; font-weight: 800; fill: #1d4ed8; }
      .line-blue { stroke: #2563eb; stroke-width: 2.7; fill: none; marker-end: url(#arrow-blue); }
      .line-orange { stroke: #d97706; stroke-width: 2.6; fill: none; marker-end: url(#arrow-orange); }
      .line-green { stroke: #16834a; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
      .line-neutral { stroke: #94a3b8; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#background)"/>
  <rect width="1600" height="126" fill="url(#header)"/>
  <text x="72" y="57" class="title">CRAG-Demo 多租户知识平台</text>
  <text x="72" y="88" class="subtitle">Console / Open 双入口 · gRPC 服务边界 · Redis Streams 可靠事件 · 多知识库 RAG</text>

  <line x1="1110" y1="44" x2="1164" y2="44" class="line-blue"/>
  <text x="1178" y="49" class="subtitle">同步 HTTP / gRPC</text>
  <line x1="1110" y1="79" x2="1164" y2="79" class="line-orange"/>
  <text x="1178" y="84" class="subtitle">Redis Streams 事件</text>
  <line x1="1375" y1="44" x2="1429" y2="44" class="line-green"/>
  <text x="1443" y="49" class="subtitle">数据 / 模型依赖</text>

  <!-- 调用方与 HTTP 入口 -->
  <rect x="54" y="150" width="1492" height="178" rx="14" class="shell"/>
  <text x="82" y="183" class="section">调用方与 HTTP 入口</text>

  <rect x="92" y="214" width="220" height="70" rx="10" class="actor"/>
  <text x="202" y="256" text-anchor="middle" class="card-title-sm">管理控制台用户</text>
  <rect x="388" y="202" width="334" height="94" rx="11" class="gateway"/>
  <text x="416" y="237" class="card-title">console-api :8080</text>
  <text x="416" y="264" class="text">JWT 管理 API · Access / Knowledge / RAG 编排</text>

  <rect x="878" y="202" width="334" height="94" rx="11" class="gateway"/>
  <text x="906" y="237" class="card-title">open-api :8081</text>
  <text x="906" y="264" class="text">API Key 查询 · 缓存与失效版本水位</text>
  <rect x="1288" y="214" width="220" height="70" rx="10" class="actor"/>
  <text x="1398" y="256" text-anchor="middle" class="card-title-sm">外部 API 调用方</text>

  <path d="M312 249H378" class="line-blue"/>
  <path d="M1288 249H1222" class="line-blue"/>
  <text x="345" y="237" text-anchor="middle" class="label-blue">HTTPS / JSON</text>
  <text x="1255" y="237" text-anchor="middle" class="label-blue">HTTPS / JSON</text>

  <!-- 同步调用到领域服务 -->
  <path d="M555 296V354H283V386" class="line-blue"/>
  <path d="M555 296V354H800V386" class="line-blue"/>
  <path d="M555 296V344H1317V386" class="line-blue"/>
  <path d="M1045 296V336H283V386" class="line-blue"/>
  <path d="M1045 296V344H1317V386" class="line-blue"/>
  <rect x="688" y="333" width="224" height="25" rx="12" class="pill"/>
  <text x="800" y="350" text-anchor="middle" class="pill-text">带服务身份的同步 gRPC</text>

  <!-- 领域服务 -->
  <rect x="54" y="370" width="1492" height="318" rx="14" class="shell"/>
  <text x="82" y="404" class="section">领域服务</text>

  <rect x="92" y="428" width="382" height="212" rx="12" class="access"/>
  <text x="120" y="466" class="card-title">Access Service</text>
  <text x="120" y="495" class="text">Identity · Tenant · Membership</text>
  <text x="120" y="521" class="text">RS256 JWT · Refresh Session</text>
  <text x="120" y="547" class="text">API Key · Scope · 版本化失效</text>
  <rect x="120" y="570" width="326" height="44" rx="8" class="mini"/>
  <text x="283" y="588" text-anchor="middle" class="mini-title">安全边界</text>
  <text x="283" y="606" text-anchor="middle" class="small">密码 Argon2id · Key 仅一次性返回 · 跨租户隔离</text>

  <rect x="609" y="428" width="382" height="212" rx="12" class="knowledge"/>
  <text x="637" y="466" class="card-title">Knowledge Service</text>
  <text x="637" y="495" class="text">KnowledgeBase · Document · 文件</text>
  <text x="637" y="521" class="text">摄取状态投影 · operationVersion</text>
  <text x="637" y="547" class="text">Retry · Reconciler · CAS</text>
  <rect x="637" y="570" width="326" height="44" rx="8" class="mini"/>
  <text x="800" y="588" text-anchor="middle" class="mini-title">Document 生命周期</text>
  <text x="800" y="606" text-anchor="middle" class="small">PENDING → PROCESSING → READY / FAILED</text>

  <rect x="1126" y="428" width="382" height="212" rx="12" class="rag"/>
  <text x="1154" y="466" class="card-title">RAG Service</text>
  <text x="1154" y="495" class="text">版本化 Ingestion · ingestion_job</text>
  <text x="1154" y="521" class="text">Dense + Sparse → RRF → Rerank</text>
  <text x="1154" y="547" class="text">Parent Evidence → answer + sources</text>
  <rect x="1154" y="570" width="326" height="44" rx="8" class="mini"/>
  <text x="1317" y="588" text-anchor="middle" class="mini-title">召回隔离键</text>
  <text x="1317" y="606" text-anchor="middle" class="small">knowledgeBaseId + READY operationVersion</text>

  <!-- 可靠事件：Knowledge 与 RAG 双向状态闭环 -->
  <path d="M991 495H1116" class="line-orange"/>
  <text x="1054" y="483" text-anchor="middle" class="label-orange">DOC_UPLOADED</text>
  <path d="M1126 548H1001" class="line-orange"/>
  <text x="1064" y="567" text-anchor="middle" class="label-orange">INGESTION_*</text>
  <text x="800" y="661" text-anchor="middle" class="label-orange">Redis Streams · Outbox / Consumer Group / ACK / Reclaim / DLQ</text>

  <!-- 数据与模型基础设施 -->
  <rect x="54" y="718" width="1492" height="346" rx="14" class="shell"/>
  <text x="82" y="752" class="section">数据与模型基础设施</text>

  <text x="82" y="784" class="card-title-sm">PostgreSQL 17 + pgvector</text>
  <text x="330" y="784" class="small">独立账号与 Schema · 禁止跨 Schema 查询、写入和外键</text>

  <!-- 基础设施依赖线先绘制，随后由卡片覆盖穿越区域，避免遮挡文字 -->
  <path d="M800 640C765 774 606 823 522 911" class="line-green"/>
  <path d="M1317 640C1240 780 990 838 867 911" class="line-green"/>
  <text x="1050" y="845" class="label-green">embed / rerank</text>
  <path d="M1317 640V911" class="line-green"/>
  <text x="1331" y="895" class="label-green">generate</text>
  <path d="M218 911V892H800V688" class="line-orange"/>
  <text x="402" y="906" class="label-orange">可靠事件传输</text>

  <rect x="112" y="805" width="342" height="76" rx="10" class="schema"/>
  <text x="283" y="835" text-anchor="middle" class="card-title-sm">access schema</text>
  <text x="283" y="860" text-anchor="middle" class="small">User / Tenant / Session / Key / Outbox</text>
  <rect x="629" y="805" width="342" height="76" rx="10" class="schema"/>
  <text x="800" y="835" text-anchor="middle" class="card-title-sm">knowledge schema</text>
  <text x="800" y="860" text-anchor="middle" class="small">KnowledgeBase / Document / Outbox</text>
  <rect x="1146" y="805" width="342" height="76" rx="10" class="schema"/>
  <text x="1317" y="835" text-anchor="middle" class="card-title-sm">rag schema</text>
  <text x="1317" y="860" text-anchor="middle" class="small">Chunk / FTS / Vector / Ingestion Job</text>
  <text x="530" y="870" class="label-green">file stream</text>

  <path d="M283 640V795" class="line-green"/>
  <path d="M800 640V795" class="line-green"/>
  <path d="M1317 640V795" class="line-green"/>
  <text x="297" y="714" class="label-green">Schema owner</text>
  <text x="814" y="714" class="label-green">Schema owner</text>
  <text x="1331" y="714" class="label-green">Schema owner</text>

  <rect x="82" y="921" width="272" height="92" rx="10" class="infra"/>
  <text x="108" y="953" class="card-title-sm">Redis 7.4</text>
  <text x="108" y="979" class="text">Streams 事件传输</text>
  <text x="108" y="1001" class="small">Snowflake Worker lease · 缓存</text>

  <rect x="386" y="921" width="272" height="92" rx="10" class="infra"/>
  <text x="412" y="953" class="card-title-sm">文件存储</text>
  <text x="412" y="979" class="text">Knowledge 原始文档</text>
  <text x="412" y="1001" class="small">gRPC ReadDocumentFile 流式读取</text>

  <rect x="690" y="921" width="354" height="92" rx="10" class="infra"/>
  <text x="716" y="953" class="card-title-sm">Python Sidecar :8001</text>
  <text x="716" y="979" class="text">GTE Chinese `/embed`</text>
  <text x="716" y="1001" class="small">bge-reranker-v2-m3 `/rerank`</text>

  <rect x="1076" y="921" width="430" height="92" rx="10" class="infra"/>
  <text x="1102" y="953" class="card-title-sm">LLM Provider</text>
  <text x="1102" y="979" class="text">确定性 Stub / DeepSeek</text>
  <text x="1102" y="1001" class="small">Evidence → answer + sources</text>

  <rect x="54" y="1080" width="1492" height="26" rx="8" fill="#e2e8f0"/>
  <text x="800" y="1098" text-anchor="middle" class="small">Smoke 是原服务的条件 Profile：Access :8091 · Knowledge :8092 · RAG :8082（无独立 Smoke 进程）</text>
</svg>
