<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">CRAG-Demo 多租户知识平台架构</title>
  <desc id="desc">CRAG-Demo 当前目标架构包含 Console API、Open API、Access Service、Knowledge Service、RAG Service、PostgreSQL 独立 Schema、Redis Streams、Sidecar 和 LLM。实线表示已落地平台基础，虚线表示后续业务链路。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="100%" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#16834a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#b76b00"/>
    </marker>
    <style>
      .title { font: 800 40px Arial, "Microsoft YaHei", sans-serif; fill: #101828; letter-spacing: 0; }
      .subtitle { font: 600 17px Arial, "Microsoft YaHei", sans-serif; fill: #4b5565; letter-spacing: 0; }
      .section-title { font: 800 21px Arial, "Microsoft YaHei", sans-serif; fill: #1f3f6d; letter-spacing: 0; }
      .card-title { font: 800 21px Arial, "Microsoft YaHei", sans-serif; fill: #101828; letter-spacing: 0; }
      .card-title-tight { font: 800 19px Arial, "Microsoft YaHei", sans-serif; fill: #101828; letter-spacing: 0; }
      .card-subtitle { font: 700 14px Arial, "Microsoft YaHei", sans-serif; fill: #667085; letter-spacing: 0; }
      .text { font: 500 14px Arial, "Microsoft YaHei", sans-serif; fill: #28364c; letter-spacing: 0; }
      .small { font: 500 12px Arial, "Microsoft YaHei", sans-serif; fill: #344054; letter-spacing: 0; }
      .label { font: 700 12px Arial, "Microsoft YaHei", sans-serif; fill: #2563eb; letter-spacing: 0; }
      .green-label { font: 700 12px Arial, "Microsoft YaHei", sans-serif; fill: #16834a; letter-spacing: 0; }
      .orange-label { font: 700 12px Arial, "Microsoft YaHei", sans-serif; fill: #9a5b00; letter-spacing: 0; }
      .badge-done { font: 800 12px Arial, "Microsoft YaHei", sans-serif; fill: #137a42; letter-spacing: 0; }
      .badge-next { font: 800 12px Arial, "Microsoft YaHei", sans-serif; fill: #995900; letter-spacing: 0; }
      .shell { fill: #ffffff; stroke: #d0d7e2; stroke-width: 1.4; }
      .entry-card { fill: #f7fbff; stroke: #2563eb; stroke-width: 2; filter: url(#shadow); }
      .service-card { fill: #ffffff; stroke: #3b82f6; stroke-width: 2; filter: url(#shadow); }
      .service-next { fill: #fffaf2; stroke: #d18b1f; stroke-width: 2; filter: url(#shadow); }
      .rag-card { fill: #f8fbff; stroke: #5865cc; stroke-width: 2; filter: url(#shadow); }
      .infra-card { fill: #f7fffb; stroke: #16834a; stroke-width: 2; filter: url(#shadow); }
      .support-card { fill: #fafafa; stroke: #8792a2; stroke-width: 1.6; filter: url(#shadow); }
      .mini { fill: #ffffff; stroke: #d0d7e2; stroke-width: 1.2; }
      .pill-done { fill: #e7f8ef; stroke: #1b9355; stroke-width: 1; }
      .pill-next { fill: #fff4d8; stroke: #d69422; stroke-width: 1; }
      .line-blue { stroke: #2563eb; stroke-width: 2.8; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: #16834a; stroke-width: 2.8; fill: none; marker-end: url(#arrow-green); }
      .line-orange { stroke: #b76b00; stroke-width: 2.4; fill: none; marker-end: url(#arrow-orange); }
      .line-dash { stroke: #7a8799; stroke-width: 2.3; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow-blue); }
      .line-dash-orange { stroke: #b76b00; stroke-width: 2.3; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow-orange); }
      .bus { stroke: #7a8799; stroke-width: 2.1; stroke-dasharray: 8 7; fill: none; }
      .divider { stroke: #d9e2ee; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <text x="800" y="56" text-anchor="middle" class="title">CRAG-Demo 多租户知识平台架构</text>
  <text x="800" y="88" text-anchor="middle" class="subtitle">五进程平台骨架 + RAG 主链路 + Redis Streams 可靠事件基础设施</text>
  <text x="800" y="114" text-anchor="middle" class="subtitle">实线：已完成基础能力；虚线：后续 router 阶段承载的业务链路</text>

  <rect x="56" y="144" width="1488" height="148" rx="12" class="shell"/>
  <text x="88" y="180" class="section-title">客户端与 HTTP 入口</text>
  <rect x="116" y="204" width="210" height="58" rx="8" class="support-card"/>
  <text x="221" y="239" text-anchor="middle" class="text">管理控制台用户</text>
  <rect x="464" y="190" width="270" height="82" rx="8" class="entry-card"/>
  <text x="494" y="224" class="card-title">crag-console-api</text>
  <text x="494" y="249" class="text">JWT 验签、管理用例编排</text>
  <rect x="866" y="190" width="270" height="82" rx="8" class="entry-card"/>
  <text x="896" y="224" class="card-title">crag-open-api</text>
  <text x="896" y="249" class="text">API Key 查询入口</text>
  <rect x="1274" y="204" width="210" height="58" rx="8" class="support-card"/>
  <text x="1379" y="239" text-anchor="middle" class="text">外部 API 调用方</text>
  <path d="M326 233H454" class="line-blue"/>
  <path d="M1274 233h-128" class="line-blue"/>
  <text x="390" y="223" text-anchor="middle" class="label">HTTP</text>
  <text x="1210" y="223" text-anchor="middle" class="label">HTTP</text>

  <rect x="56" y="326" width="1488" height="366" rx="12" class="shell"/>
  <text x="88" y="362" class="section-title">业务服务层</text>

  <rect x="112" y="400" width="314" height="174" rx="10" class="service-next"/>
  <text x="140" y="436" class="card-title">Access Service</text>
  <rect x="318" y="415" width="78" height="24" rx="12" class="pill-next"/>
  <text x="357" y="432" text-anchor="middle" class="badge-next">router3</text>
  <text x="140" y="466" class="text">User / Tenant / Membership</text>
  <text x="140" y="493" class="text">JWT、Refresh Session</text>
  <text x="140" y="520" class="text">API Key、Scope 与权限判断</text>
  <text x="140" y="547" class="small">当前已具备独立进程、Schema、gRPC Probe</text>

  <rect x="468" y="400" width="314" height="174" rx="10" class="service-next"/>
  <text x="496" y="436" class="card-title-tight">Knowledge Service</text>
  <rect x="690" y="415" width="78" height="24" rx="12" class="pill-next"/>
  <text x="729" y="432" text-anchor="middle" class="badge-next">router1</text>
  <text x="496" y="466" class="text">KnowledgeBase / Document</text>
  <text x="496" y="493" class="text">文件存储、状态与生命周期事件</text>
  <text x="496" y="520" class="text">gRPC 流式提供文件内容</text>
  <text x="496" y="547" class="small">plan17 已接入 smoke 事件闭环</text>

  <rect x="824" y="366" width="456" height="244" rx="10" class="rag-card"/>
  <text x="852" y="402" class="card-title">RAG Service</text>
  <rect x="1174" y="381" width="78" height="24" rx="12" class="pill-done"/>
  <text x="1213" y="398" text-anchor="middle" class="badge-done">已落地</text>
  <text x="852" y="430" class="text">唯一 RAG Gradle module；默认承载健康检查与 gRPC</text>
  <rect x="852" y="456" width="124" height="96" rx="8" class="mini"/>
  <text x="914" y="488" text-anchor="middle" class="card-subtitle">Ingestion</text>
  <text x="914" y="516" text-anchor="middle" class="small">Parse / Chunk</text>
  <text x="914" y="538" text-anchor="middle" class="small">Dense / Sparse</text>
  <rect x="998" y="456" width="124" height="96" rx="8" class="mini"/>
  <text x="1060" y="488" text-anchor="middle" class="card-subtitle">Retrieval</text>
  <text x="1060" y="516" text-anchor="middle" class="small">Dense + Sparse</text>
  <text x="1060" y="538" text-anchor="middle" class="small">RRF / Rerank</text>
  <rect x="1144" y="456" width="108" height="96" rx="8" class="mini"/>
  <text x="1198" y="488" text-anchor="middle" class="card-subtitle">Query</text>
  <text x="1198" y="516" text-anchor="middle" class="small">Context</text>
  <text x="1198" y="538" text-anchor="middle" class="small">LLM + sources</text>
  <text x="852" y="586" class="small">后续 router2：knowledgeBaseId 强隔离、Ingestion Job、状态回传</text>

  <rect x="1322" y="418" width="166" height="152" rx="10" class="service-card"/>
  <text x="1350" y="454" class="card-title">Smoke</text>
  <text x="1350" y="482" class="text">8083 / smoke profile</text>
  <text x="1350" y="509" class="text">RAG HTTP 验证</text>
  <text x="1350" y="536" class="small">非正式业务 API</text>

  <path d="M599 272V318" class="bus"/>
  <path d="M1001 272V318" class="bus"/>
  <path d="M269 318H1052" class="bus"/>
  <path d="M269 318V390" class="line-dash"/>
  <path d="M625 318V390" class="line-dash"/>
  <path d="M1052 318V356" class="line-dash"/>
  <text x="660" y="310" text-anchor="middle" class="label">gRPC：Console 编排 Access / Knowledge / RAG；Open 查询 Access / RAG</text>
  <path d="M1280 494H1312" class="line-blue"/>
  <text x="1296" y="484" text-anchor="middle" class="label">smoke</text>

  <path d="M782 486H814" class="line-dash-orange"/>
  <text x="798" y="476" text-anchor="middle" class="orange-label">事件</text>
  <path d="M824 552C762 574 694 576 640 574" class="line-dash"/>
  <text x="750" y="594" text-anchor="middle" class="label">文件流 / 状态回写</text>

  <rect x="56" y="724" width="1488" height="224" rx="12" class="shell"/>
  <text x="88" y="760" class="section-title">基础设施与数据边界</text>

  <rect x="112" y="792" width="358" height="104" rx="10" class="infra-card"/>
  <text x="140" y="827" class="card-title">PostgreSQL + pgvector</text>
  <text x="140" y="857" class="text">access / knowledge / rag 独立 Schema 与账号</text>
  <text x="140" y="884" class="small">禁止跨 Schema 查询、写入或外键</text>

  <rect x="520" y="792" width="274" height="104" rx="10" class="infra-card"/>
  <text x="548" y="827" class="card-title">Redis</text>
  <text x="548" y="857" class="text">Snowflake Worker lease</text>
  <text x="548" y="884" class="text">Redis Streams 事件传输</text>

  <rect x="844" y="792" width="274" height="104" rx="10" class="support-card"/>
  <text x="872" y="827" class="card-title">Python Sidecar</text>
  <text x="872" y="857" class="text">/embed 生成 Dense 向量</text>
  <text x="872" y="884" class="text">/rerank 精排候选 Chunk</text>

  <rect x="1168" y="792" width="274" height="104" rx="10" class="support-card"/>
  <text x="1196" y="827" class="card-title">LLM Provider</text>
  <text x="1196" y="857" class="text">Stub / DeepSeek</text>
  <text x="1196" y="884" class="text">生成 answer + sources</text>

  <path d="M269 574V782" class="line-green"/>
  <path d="M625 574V782" class="line-green"/>
  <path d="M1052 610V782" class="line-green"/>
  <path d="M657 792C704 700 858 654 938 610" class="line-green"/>
  <path d="M981 610V782" class="line-blue"/>
  <path d="M1198 610C1242 654 1292 718 1305 782" class="line-blue"/>
  <text x="304" y="688" class="green-label">Schema owner</text>
  <text x="644" y="688" class="green-label">Outbox / Streams</text>
  <text x="1082" y="700" class="green-label">RAG Schema</text>
  <text x="1010" y="720" class="label">embed / rerank</text>
  <text x="1308" y="720" class="label">generate</text>

  <rect x="56" y="980" width="1488" height="86" rx="12" class="shell"/>
  <text x="88" y="1016" class="section-title">当前完成度</text>
  <text x="260" y="1016" class="text">plan_14 五进程骨架与 gRPC</text>
  <line x1="472" y1="998" x2="472" y2="1048" class="divider"/>
  <text x="500" y="1016" class="text">plan_15 Snowflake ID + Redis lease</text>
  <line x1="752" y1="998" x2="752" y2="1048" class="divider"/>
  <text x="780" y="1016" class="text">plan_16 RAG module 收口 + smoke 入口</text>
  <line x1="1082" y1="998" x2="1082" y2="1048" class="divider"/>
  <text x="1110" y="1016" class="text">plan_17 Outbox / Redis Streams / DLQ</text>
  <text x="260" y="1044" class="small">后续 router1-5 继续落地 Knowledge、RAG 多知识库、Access、双 API 与生命周期可靠性</text>
</svg>
