<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | CRAG Web Console</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            darkMode: "class",

                extend: {
                    colors: {
                        "on-surface-variant": "#414755",

                        "inverse-surface": "#2d3039",
                        "outline": "#727786",
                        "on-secondary-fixed": "#1b1c1c",
                        "background": "#faf9ff",

                        "on-tertiary": "#ffffff",
                        "warning": "#faad14",
                        "on-secondary-fixed-variant": "#464747",
                        "on-tertiary-fixed-variant": "#7c2e00",
                        "surface-container-high": "#e6e7f3",
                        "text-primary": "#262626",
                        "bg-elevated": "#ffffff",
                        "success": "#52c41a",
                        "primary-fixed": "#d9e2ff",
                        "bg-container": "#f5f5f5",
                        "surface-container-highest": "#e0e2ed",
                        "surface-dim": "#d8d9e5",
                        "primary-fixed-dim": "#afc6ff",
                        "error-container": "#ffdad6",
                        "on-surface": "#181b23",
                        "surface-container-low": "#f2f3ff",
                        "primary-container": "#006ef2",
                        "tertiary-fixed-dim": "#ffb695",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#fefcff",
                        "text-disabled": "#8c8c8c",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#fffbff",
                        "surface-variant": "#e0e2ed",
                        "on-tertiary-fixed": "#351000",
                        "secondary-container": "#e1dfdf",
                        "tertiary": "#9e3d00",
                        "on-primary-fixed": "#001a43",
                        "surface": "#faf9ff",
                        "tertiary-fixed": "#ffdbcc",
                        "secondary": "#5e5e5e",
                        "primary": "#0057c2",
                        "surface-bright": "#faf9ff",
                        "inverse-on-surface": "#eff0fc",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c1c6d7",
                        "error": "#ff4d4f",
                        "on-error": "#ffffff",
                        "surface-tint": "#0059c7",
                        "on-primary-fixed-variant": "#004398",
                        "on-background": "#181b23"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    spacing: {
                        unit: "4px",
                        "container-max-width": "1200px",
                        "margin-page": "24px",
                        "padding-compact": "8px",

                    fontFamily: {

                }
            }
        };

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            font-size: 20px;
        }
        body {
            background-color: #ffffff; /* Clean flat white surface */
        }
        .ant-input-focus:focus-within {
            border-color: #1677ff;
            box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1);
            outline: none;
        }
    </style>
</head>
<body class="font-body-md text-text-primary antialiased">
<div class="min-h-screen flex flex-col justify-center items-center px-margin-page">
<!-- Header / Logo Area -->
<div class="mb-10 text-center">
<div class="flex items-center justify-center">
<div class="w-10 h-10 bg-[#001529] rounded-lg flex items-center justify-center text-white mr-3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">database</span>
</div>
<h1 class="font-headline-lg text-headline-lg font-extrabold tracking-tight text-on-surface">CRAG Console</h1>
</div>
</div>
<!-- Login Form Container -->
<div class="w-full max-w-[400px] bg-bg-elevated border border-border-base p-8 rounded-lg">
<h2 class="font-headline-md text-headline-md mb-6 text-center">Log In</h2>
<!-- Inline Error Example -->
<div class="mb-6 p-3 bg-[#fff2f0] border border-[#ffccc7] rounded flex items-start text-error font-body-sm">
<span class="material-symbols-outlined text-[16px] mr-2 mt-0.5">error</span>
<span>Invalid email or password</span>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative ant-input-focus transition-all duration-200 border border-border-base rounded px-3 py-2 flex items-center bg-white">
<span class="material-symbols-outlined text-text-disabled mr-2">person</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-body-md font-body-md placeholder:text-text-disabled" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative ant-input-focus transition-all duration-200 border border-border-base rounded px-3 py-2 flex items-center bg-white">
<span class="material-symbols-outlined text-text-disabled mr-2">lock</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-body-md font-body-md placeholder:text-text-disabled" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button class="text-text-disabled hover:text-on-surface-variant transition-colors ml-2 flex items-center" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-processing text-white py-2 rounded font-label-md text-label-md hover:bg-opacity-80 active:scale-[0.98] transition-all flex justify-center items-center h-10" type="submit">
                    Log In
                </button>
</form>
<!-- Registration Redirect -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant font-body-md">
                    Don't have an account?
                    <a class="text-processing font-label-md hover:text-opacity-80 transition-colors ml-1" href="#">Register now</a>
</p>
</div>
</div>
</div>
<!-- Micro-interaction script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const passInput = document.getElementById('password');
            const toggleBtn = passInput.nextElementSibling;

            toggleBtn.addEventListener('click', () => {
                const isPassword = passInput.getAttribute('type') === 'password';
                passInput.setAttribute('type', isPassword ? 'text' : 'password');
                toggleBtn.querySelector('span').innerText = isPassword ? 'visibility_off' : 'visibility';
            });

            // Smooth form submission animation
            const form = document.querySelector('form');
            form.addEventListener('submit', (e) => {
                e.preventDefault(); // Prevent actual submission for demo purposes
                const btn = form.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.classList.add('opacity-80', 'cursor-not-allowed');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2">progress_activity</span> Logging in...';
            });
        });
    </script>
</body></html>
