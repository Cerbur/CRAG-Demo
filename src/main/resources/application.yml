server:
  port: 8080

spring:
  application:
    name: crag-demo

  # plan_1 脚手架阶段排除 Spring AI 自动配置（plan_2 正式接入时移除此项）
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/crag_demo
    username: crag_user
    password: crag_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none          # DDL 由 schema.sql 手动管理
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always            # 每次启动执行 schema.sql + data.sql
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

logging:
  level:
    com.crag.demo: DEBUG
    org.springframework.web: INFO
