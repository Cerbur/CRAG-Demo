server:
  port: 8092

spring:
  application:
    name: knowledge-service
  datasource:
    url: jdbc:postgresql://db:5432/crag_platform?currentSchema=knowledge
    username: crag_knowledge
    password: ${CARG_KNOWLEDGE_PASSWORD:knowledge_demo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-knowledge.sql
  data:
    redis:
      host: ${CARG_REDIS_HOST:redis}
      port: ${CARG_REDIS_PORT:6379}

crag:
  grpc:
    server:
      bind-port: 9092
      shutdown-timeout: PT5S
      allowed-callers:
        console-api: ${CONSOLE_API_SERVICE_TOKEN:console-token-demo}
  event:
    stream-key: crag:event:knowledge
    dlq-stream-key: crag:event:knowledge:dlq
    publisher:
      enabled: true
      max-attempts: 5
      claim-duration: 30s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,expectedSchema
