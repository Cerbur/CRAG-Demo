server:
  port: 8092

spring:
  application:
    name: knowledge-service
  datasource:
    url: jdbc:postgresql://db:5432/crag_platform?currentSchema=knowledge
    username: crag_knowledge
    password: ${CARG_KNOWLEDGE_PASSWORD:knowledge_demo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-knowledge.sql

crag:
  grpc:
    server:
      bind-port: 9092
      shutdown-timeout: PT5S
      allowed-callers:
        console-api: ${CONSOLE_API_SERVICE_TOKEN:console-token-demo}
    client:
      caller-service: knowledge-service
      token: ${KNOWLEDGE_API_SERVICE_TOKEN:knowledge-token-demo}
  knowledge:
    reconciler:
      rag-target: ${RAG_SERVICE_TARGET:rag-service:9093}
      pending-stale-threshold: 2m
      processing-stale-threshold: 15m
      batch-size: 50
      schedule-interval: 60s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,expectedSchema
