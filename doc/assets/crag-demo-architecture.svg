<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc">
  <title id="title">CRAG-Demo DDD 领域架构</title>
  <desc id="desc">CRAG-Demo 当前以单 Spring Boot 服务承载 Access、KnowledgeBase、Ingestion、Retrieval、Query 等 DDD 领域模块，未来可按领域拆为微服务；所有异步监听当前由 Cron 定时扫表实现。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f8fb"/>
    </linearGradient>
    <linearGradient id="appBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="storageBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fffb"/>
      <stop offset="100%" stop-color="#eaf8f0"/>
    </linearGradient>
    <linearGradient id="cronBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#fff0d8"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="128%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15345c" flood-opacity="0.13"/>
    </filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2463c9"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#16834a"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#b76b00"/>
    </marker>
    <style>
      .title { font: 800 38px Arial, "Microsoft YaHei", sans-serif; fill: #0b1742; letter-spacing: 0; }
      .subtitle { font: 600 17px Arial, "Microsoft YaHei", sans-serif; fill: #445064; letter-spacing: 0; }
      .area-title { font: 800 22px Arial, "Microsoft YaHei", sans-serif; fill: #17407e; letter-spacing: 0; }
      .module-title { font: 800 22px Arial, "Microsoft YaHei", sans-serif; fill: #101828; letter-spacing: 0; }
      .module-subtitle { font: 700 15px Arial, "Microsoft YaHei", sans-serif; fill: #475467; letter-spacing: 0; }
      .small { font: 500 14px Arial, "Microsoft YaHei", sans-serif; fill: #243044; letter-spacing: 0; }
      .tiny { font: 500 12px Arial, "Microsoft YaHei", sans-serif; fill: #344054; letter-spacing: 0; }
      .label { font: 700 13px Arial, "Microsoft YaHei", sans-serif; fill: #2463c9; letter-spacing: 0; }
      .green-label { font: 700 13px Arial, "Microsoft YaHei", sans-serif; fill: #16834a; letter-spacing: 0; }
      .orange-label { font: 700 13px Arial, "Microsoft YaHei", sans-serif; fill: #9a5b00; letter-spacing: 0; }
      .future-badge { font: 800 13px Arial, "Microsoft YaHei", sans-serif; fill: #8a5a00; letter-spacing: 0; }
      .ready-badge { font: 800 13px Arial, "Microsoft YaHei", sans-serif; fill: #137a42; letter-spacing: 0; }
      .app-shell { fill: url(#appBg); stroke: #1d5fbf; stroke-width: 2; }
      .storage-shell { fill: url(#storageBg); stroke: #16834a; stroke-width: 2; }
      .cron-shell { fill: url(#cronBg); stroke: #c98214; stroke-width: 2; }
      .future-card { fill: #ffffff; stroke: #b76b00; stroke-width: 2; stroke-dasharray: 8 6; filter: url(#shadow); }
      .ready-card { fill: #ffffff; stroke: #1d5fbf; stroke-width: 2; filter: url(#shadow); }
      .query-card { fill: #ffffff; stroke: #6b55c7; stroke-width: 2; filter: url(#shadow); }
      .mini { fill: #f8fafc; stroke: #d0d7e2; stroke-width: 1; }
      .line { stroke: #2463c9; stroke-width: 2.6; fill: none; marker-end: url(#blueArrow); }
      .green-line { stroke: #16834a; stroke-width: 2.6; fill: none; marker-end: url(#greenArrow); }
      .orange-line { stroke: #b76b00; stroke-width: 2.4; fill: none; marker-end: url(#orangeArrow); }
      .dash { stroke: #7a8799; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
      .divider { stroke: #d6deea; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1440" height="1440" fill="url(#bg)"/>
  <text x="720" y="48" text-anchor="middle" class="title">CRAG-Demo DDD 领域架构</text>
  <text x="720" y="78" text-anchor="middle" class="subtitle">当前：单 Spring Boot 服务承载多个领域模块，所有异步监听由 Cron 定时扫表实现</text>
  <text x="720" y="104" text-anchor="middle" class="subtitle">未来：按 Access / KnowledgeBase / Ingestion / Retrieval / Query 拆分微服务</text>

  <rect x="56" y="130" width="1328" height="634" rx="12" class="app-shell"/>
  <text x="92" y="166" class="area-title">CRAG-Demo Application（Modular Monolith）</text>
  <text x="92" y="192" class="subtitle">模块间通过应用服务与领域接口协作，避免把未来微服务边界写散到 Controller / DAO 细节里</text>

  <!-- Left write side -->
  <rect x="96" y="204" width="330" height="124" rx="8" class="future-card"/>
  <text x="124" y="238" class="module-title">Access</text>
  <rect x="322" y="217" width="76" height="24" rx="12" fill="#fff4d8" stroke="#d69422"/>
  <text x="360" y="234" text-anchor="middle" class="future-badge">未规划</text>
  <text x="124" y="266" class="small">用户、多租户、租户成员关系</text>
  <text x="124" y="291" class="small">鉴权、访问控制、KnowledgeBase keychain</text>
  <text x="124" y="316" class="small">Query 侧 keychain 校验与 tenant context</text>

  <rect x="96" y="392" width="330" height="124" rx="8" class="future-card"/>
  <text x="124" y="426" class="module-title">KnowledgeBase</text>
  <rect x="322" y="405" width="76" height="24" rx="12" fill="#fff4d8" stroke="#d69422"/>
  <text x="360" y="422" text-anchor="middle" class="future-badge">未规划</text>
  <text x="124" y="454" class="small">Tenant - KnowledgeBase 关系维护</text>
  <text x="124" y="479" class="small">KnowledgeBase - Document 关系维护</text>
  <text x="124" y="504" class="small">不负责 Chunk、Embedding、检索索引</text>

  <rect x="96" y="580" width="330" height="124" rx="8" class="ready-card"/>
  <text x="124" y="614" class="module-title">Ingestion</text>
  <rect x="322" y="593" width="76" height="24" rx="12" fill="#e7f8ef" stroke="#1b9355"/>
  <text x="360" y="610" text-anchor="middle" class="ready-badge">已规划</text>
  <text x="124" y="642" class="small">监听 Doc 变更，执行 Doc -&gt; Chunk</text>
  <text x="124" y="667" class="small">基于 Chunk 变更写 Sparse / Dense 索引</text>
  <text x="124" y="692" class="small">负责 Chunk、Sparse、Dense 库写入</text>

  <!-- Right read side -->
  <rect x="1014" y="204" width="330" height="148" rx="8" class="query-card"/>
  <text x="1042" y="238" class="module-title">Query</text>
  <rect x="1240" y="217" width="76" height="24" rx="12" fill="#e7f8ef" stroke="#1b9355"/>
  <text x="1278" y="234" text-anchor="middle" class="ready-badge">已规划</text>
  <text x="1042" y="266" class="small">UserQuery API</text>
  <text x="1042" y="291" class="small">Context 工程、Prompt 组装</text>
  <text x="1042" y="316" class="small">LLM 调用，生成 answer + sources</text>
  <text x="1042" y="341" class="small">依赖 Retrieval 召回上下文</text>

  <rect x="1014" y="472" width="330" height="148" rx="8" class="ready-card"/>
  <text x="1042" y="506" class="module-title">Retrieval</text>
  <rect x="1240" y="485" width="76" height="24" rx="12" fill="#e7f8ef" stroke="#1b9355"/>
  <text x="1278" y="502" text-anchor="middle" class="ready-badge">已规划</text>
  <text x="1042" y="534" class="small">查询 Sparse 与 Dense</text>
  <text x="1042" y="559" class="small">RRF 融合双路召回结果</text>
  <text x="1042" y="584" class="small">回表召回 Chunk / parent context</text>
  <text x="1042" y="609" class="small">把候选上下文返回给 Query</text>

  <!-- Center orchestration -->
  <rect x="528" y="224" width="384" height="110" rx="8" class="mini"/>
  <text x="720" y="258" text-anchor="middle" class="module-title">单服务内的领域协作</text>
  <text x="720" y="287" text-anchor="middle" class="small">Controller / Service / Core(domain) / DAO / Integration / Cron</text>
  <text x="720" y="312" text-anchor="middle" class="tiny">每个已实现领域内部仍遵守现有代码分层约束</text>

  <rect x="528" y="394" width="384" height="130" rx="8" class="mini"/>
  <text x="720" y="428" text-anchor="middle" class="module-title">RAG 主链路</text>
  <text x="720" y="457" text-anchor="middle" class="small">写入：Doc -&gt; Chunk -&gt; Sparse / Dense</text>
  <text x="720" y="482" text-anchor="middle" class="small">查询：Sparse + Dense -&gt; RRF -&gt; Rerank -&gt; LLM</text>
  <text x="720" y="507" text-anchor="middle" class="tiny">child chunk 检索，parent chunk 提供上下文窗口</text>

  <rect x="528" y="584" width="384" height="94" rx="8" class="mini"/>
  <text x="720" y="618" text-anchor="middle" class="module-title">模型接入</text>
  <text x="720" y="647" text-anchor="middle" class="small">Python Sidecar：/embed、/rerank</text>
  <text x="720" y="672" text-anchor="middle" class="small">Spring AI / DeepSeek：LLM 生成</text>

  <!-- Domain arrows -->
  <path d="M261 328v58" class="orange-line"/>
  <text x="284" y="361" class="orange-label">tenant ownership</text>
  <path d="M261 516v58" class="orange-line"/>
  <text x="284" y="549" class="orange-label">document changes</text>

  <path d="M426 266C610 206 820 206 1014 270" class="line"/>
  <text x="720" y="220" text-anchor="middle" class="label">keychain / tenant context</text>

  <path d="M1179 352v114" class="line"/>
  <text x="1202" y="414" class="label">recall request</text>

  <path d="M1014 548C856 548 690 562 426 642" class="dash"/>
  <text x="725" y="556" text-anchor="middle" class="tiny">Retrieval 与 Ingestion 共用 Chunk / Sparse / Dense 存储</text>

  <!-- Storage -->
  <rect x="96" y="820" width="1248" height="144" rx="10" class="storage-shell"/>
  <text x="124" y="858" class="area-title" fill="#137a42">PostgreSQL + pgvector</text>
  <line x1="390" y1="842" x2="390" y2="938" class="divider"/>
  <line x1="704" y1="842" x2="704" y2="938" class="divider"/>
  <line x1="1016" y1="842" x2="1016" y2="938" class="divider"/>
  <text x="414" y="858" class="small">tenant / user / keychain</text>
  <text x="414" y="888" class="tiny">未来 Access 数据</text>
  <text x="414" y="918" class="tiny">当前不实现鉴权与多租户</text>
  <text x="728" y="858" class="small">knowledge_base / document</text>
  <text x="728" y="888" class="tiny">未来 KnowledgeBase 数据</text>
  <text x="728" y="918" class="tiny">维护租户、知识库、文档归属</text>
  <text x="1040" y="858" class="small">chunk / sparse index / dense embedding</text>
  <text x="1040" y="888" class="tiny">当前 RAG 主线数据</text>
  <text x="1040" y="918" class="tiny">Ingestion 写入，Retrieval 查询</text>

  <path d="M261 704v110" class="green-line"/>
  <text x="284" y="768" class="green-label">write</text>
  <path d="M1179 620v194" class="green-line"/>
  <text x="1202" y="724" class="green-label">read</text>

  <!-- Cron -->
  <rect x="96" y="1002" width="1248" height="118" rx="10" class="cron-shell"/>
  <text x="124" y="1038" class="area-title" fill="#9a5b00">Cron Listeners</text>
  <text x="326" y="1038" class="small">当前所有监听统一用 Spring @Scheduled 定时扫表</text>
  <text x="326" y="1070" class="small">Doc 变更处理、Chunk 变更写 Sparse / Dense、失败重试、状态推进、CAS 抢占</text>
  <text x="326" y="1100" class="tiny">未来拆微服务后可替换为 MQ / 事件总线；领域边界不随触发方式改变</text>

  <path d="M520 1002C420 940 330 838 300 704" class="orange-line"/>
  <text x="416" y="930" class="orange-label">scheduled scan</text>
  <path d="M804 1002C918 940 1080 804 1138 620" class="orange-line"/>
  <text x="962" y="930" class="orange-label">status retry</text>

  <!-- Future split -->
  <rect x="96" y="1160" width="1248" height="194" rx="10" fill="#ffffff" stroke="#d0d7e2" stroke-width="2"/>
  <text x="124" y="1198" class="area-title">未来微服务拆分方向</text>
  <text x="124" y="1226" class="subtitle">当前先用领域模块保持边界清晰，后续可把每个领域独立部署、独立扩缩容、独立演进。</text>
  <rect x="128" y="1262" width="210" height="58" rx="8" class="future-card"/>
  <text x="233" y="1297" text-anchor="middle" class="small">Access Service</text>
  <rect x="366" y="1262" width="210" height="58" rx="8" class="future-card"/>
  <text x="471" y="1297" text-anchor="middle" class="small">KnowledgeBase Service</text>
  <rect x="604" y="1262" width="210" height="58" rx="8" class="ready-card"/>
  <text x="709" y="1297" text-anchor="middle" class="small">Ingestion Service</text>
  <rect x="842" y="1262" width="210" height="58" rx="8" class="ready-card"/>
  <text x="947" y="1297" text-anchor="middle" class="small">Retrieval Service</text>
  <rect x="1080" y="1262" width="210" height="58" rx="8" class="query-card"/>
  <text x="1185" y="1297" text-anchor="middle" class="small">Query Service</text>
</svg>
