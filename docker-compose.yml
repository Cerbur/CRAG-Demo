# ============================================================
# CRAG-Demo — Docker Compose 编排
# 服务: db（PostgreSQL 17 + pgvector）+ sidecar（Python 模型服务）+ app（Spring Boot）
# 网络: crag-net（bridge）
# ============================================================

services:

  # --- PostgreSQL 17 + pgvector ---
  db:
    image: pgvector/pgvector:pg17
    container_name: crag-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crag_demo
      POSTGRES_USER: crag_user
      POSTGRES_PASSWORD: crag_pass
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crag_user -d crag_demo"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crag-net

  # --- Python Sidecar Model Service ---
  # 提供 /embed（gte Chinese embedding）和 /rerank（bge-reranker-v2-m3）
  model-init:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: crag-model-init
    user: root
    command: ["python", "-u", "download_models.py"]
    healthcheck:
      disable: true
    environment:
      MODELSCOPE_CACHE: /models/modelscope
    volumes:
      - ./.models/modelscope:/models/modelscope
    networks:
      - crag-net

  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: crag-sidecar
    ports:
      - "8001:8001"
    environment:
      MODELSCOPE_CACHE: /models/modelscope
      EMBEDDING_MODEL_PATH: /models/modelscope/iic__nlp_gte_sentence-embedding_chinese-base
      RERANK_MODEL_PATH: /models/modelscope/BAAI__bge-reranker-v2-m3
    volumes:
      - ./.models/modelscope:/models/modelscope:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    networks:
      - crag-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # --- Spring Boot 应用（默认模式） ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crag-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crag_demo
      SPRING_DATASOURCE_USERNAME: crag_user
      SPRING_DATASOURCE_PASSWORD: crag_pass
      CRAG_EMBEDDING_SIDECAR_URL: http://sidecar:8001
      CRAG_RERANK_SIDECAR_URL: http://sidecar:8001
      # Query LLM — Stub 模式（默认，无需凭据）
      CRAG_QUERY_LLM_PROVIDER: stub
      CRAG_QUERY_LLM_STUB_MODE: success
      # DEEPSEEK_API_KEY: 生产使用 DEEPSEEK_API_KEY 环境变量注入
      # 设置 CRAG_QUERY_LLM_PROVIDER=deepseek 并定义以下变量以启用 DeepSeek：
      # CRAG_QUERY_LLM_DEEPSEEK_BASE_URL=https://api.deepseek.com/anthropic
      # CRAG_QUERY_LLM_DEEPSEEK_MODEL=deepseek-v4-flash
      # CRAG_QUERY_LLM_DEEPSEEK_TEMPERATURE=0
      # CRAG_QUERY_LLM_DEEPSEEK_MAX_OUTPUT_TOKENS=4096
      # CRAG_QUERY_LLM_REQUEST_TIMEOUT=120s
    depends_on:
      db:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    networks:
      - crag-net

  # --- Spring Boot 应用（smoke Profile，显式启用诊断端点） ---
  app-smoke:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crag-app-smoke
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crag_demo
      SPRING_DATASOURCE_USERNAME: crag_user
      SPRING_DATASOURCE_PASSWORD: crag_pass
      CRAG_EMBEDDING_SIDECAR_URL: http://sidecar:8001
      CRAG_RERANK_SIDECAR_URL: http://sidecar:8001
      # Query LLM — Stub 模式（默认，无需凭据）
      CRAG_QUERY_LLM_PROVIDER: stub
      CRAG_QUERY_LLM_STUB_MODE: success
      # DEEPSEEK_API_KEY: 生产使用 DEEPSEEK_API_KEY 环境变量注入
      # 设置 CRAG_QUERY_LLM_PROVIDER=deepseek 并定义以下变量以启用 DeepSeek：
      # CRAG_QUERY_LLM_DEEPSEEK_BASE_URL=https://api.deepseek.com/anthropic
      # CRAG_QUERY_LLM_DEEPSEEK_MODEL=deepseek-v4-flash
      # CRAG_QUERY_LLM_DEEPSEEK_TEMPERATURE=0
      # CRAG_QUERY_LLM_DEEPSEEK_MAX_OUTPUT_TOKENS=4096
      # CRAG_QUERY_LLM_REQUEST_TIMEOUT=120s
      SPRING_PROFILES_ACTIVE: smoke
    depends_on:
      db:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    networks:
      - crag-net
    profiles:
      - smoke

networks:
  crag-net:
    driver: bridge
