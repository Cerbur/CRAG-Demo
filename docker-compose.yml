      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - crag-net

  # --- Knowledge Service ---
  # 固定暴露本地诊断端口 8092。启用 CRAG_SERVICE_PROFILES=smoke 后，
  # 同端口额外注册 /api/v1/smoke/knowledge/** Controller 与 application-smoke.yml 事件闭环。
  knowledge-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_MODULE: crag-knowledge-service
    container_name: crag-knowledge-service
    ports:
      - "8092:8092"
    environment:
      SPRING_PROFILES_ACTIVE: ${CRAG_SERVICE_PROFILES:-}
      SPRING_APPLICATION_JSON: >
        {
          "spring.datasource.url": "jdbc:postgresql://db:5432/crag_platform?currentSchema=knowledge",
          "spring.datasource.username": "crag_knowledge",
          "spring.datasource.password": "${CARG_KNOWLEDGE_PASSWORD:-knowledge_demo}",
          "spring.data.redis.host": "redis",
          "spring.data.redis.port": 6379,
          "crag.grpc.server.allowed-callers.console-api": "${CONSOLE_API_SERVICE_TOKEN:-console-token-demo}",
          "crag.grpc.server.allowed-callers.rag-service": "${RAG_API_SERVICE_TOKEN:-rag-token-demo}",
          "crag.knowledge.filestore.root": "/app/knowledge-files"
        }
    volumes:
      - ./data/knowledge-files:/app/knowledge-files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8092/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - crag-net

  # --- RAG Service ---
  # 固定暴露本地诊断端口 8082。启用 CRAG_SERVICE_PROFILES=smoke 后，
  # 同端口额外注册 /api/v1/smoke/rag/** 与 /api/v1/smoke/query/** Controller
  # 与 application-smoke.yml 事件消费闭环（crag-event consumer/publisher）。
  rag-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_MODULE: crag-rag-service
    container_name: crag-rag-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${CRAG_SERVICE_PROFILES:-}
      SPRING_APPLICATION_JSON: >
        {
          "spring.datasource.url": "jdbc:postgresql://db:5432/crag_platform?currentSchema=rag,extensions",
          "spring.datasource.username": "crag_rag",
          "spring.datasource.password": "${CARG_RAG_PASSWORD:-rag_demo}",
          "spring.data.redis.host": "redis",
          "spring.data.redis.port": 6379,
          "crag.id.service-domain": "rag",
          "crag.id.required-entities": "LEGACY_DOCUMENT,CHUNK",
          "crag.embedding.sidecar-url": "http://sidecar:8001",
          "crag.rerank.sidecar-url": "http://sidecar:8001",
          "crag.grpc.server.allowed-callers.console-api": "${CONSOLE_API_SERVICE_TOKEN:-console-token-demo}",
          "crag.grpc.server.allowed-callers.open-api": "${OPEN_API_SERVICE_TOKEN:-open-token-demo}",
          "crag.grpc.client.caller-service": "rag-service",
          "crag.grpc.client.token": "${RAG_API_SERVICE_TOKEN:-rag-token-demo}",
          "crag.rag.ingestion.knowledge.target": "knowledge-service:9092"
        }
      CRAG_QUERY_LLM_PROVIDER: ${CRAG_QUERY_LLM_PROVIDER:-stub}
      CRAG_QUERY_LLM_STUB_MODE: ${CRAG_QUERY_LLM_STUB_MODE:-success}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - crag-net

  # --- Console API ---
  console-api:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_MODULE: crag-console-api
    container_name: crag-console-api
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_JSON: >
        {
          "crag.grpc.client.caller-service": "console-api",
          "crag.grpc.client.token": "${CONSOLE_API_SERVICE_TOKEN:-console-token-demo}",
          "crag.grpc.probe.targets.access-service": "access-service:9091",
          "crag.grpc.probe.targets.knowledge-service": "knowledge-service:9092",
          "crag.grpc.probe.targets.rag-service": "rag-service:9093",
          "crag.grpc.client.max-deadline-millis": 120000,
          "crag.console.allowed-origins": ["${CONSOLE_ALLOWED_ORIGINS:-http://localhost:8080}"],
          "crag.console.cookie.secure": ${CONSOLE_COOKIE_SECURE:-false},
          "crag.console.jwt.issuer": "${CONSOLE_JWT_ISSUER:-crag-access}",
          "crag.console.jwt.audience": "${CONSOLE_JWT_AUDIENCE:-crag-services}"
        }
    depends_on:
      access-service:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - crag-net

  # --- Open API ---
  open-api:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_MODULE: crag-open-api
    container_name: crag-open-api
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_JSON: >
        {
          "crag.grpc.client.caller-service": "open-api",
          "crag.grpc.client.token": "${OPEN_API_SERVICE_TOKEN:-open-token-demo}",
          "crag.grpc.probe.targets.access-service": "access-service:9091",
          "crag.grpc.probe.targets.rag-service": "rag-service:9093"
        }
    depends_on:
      access-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - crag-net

networks:
  crag-net:
    driver: bridge
