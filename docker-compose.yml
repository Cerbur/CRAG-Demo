# ============================================================
# CRAG-Demo — Docker Compose 编排
# 五个 Java 服务 + PostgreSQL + Redis + Sidecar
# plan_21/21.11: 收敛单服务 Smoke 拓扑。原服务固定暴露本地诊断端口
# （Access 8091、Knowledge 8092、RAG 8082）；Smoke Controller 作为
# 原服务在 smoke Profile 下的条件 Bean，不再创建 *-smoke 重复服务。
# 启用 smoke Profile：CRAG_SERVICE_PROFILES=smoke 后 docker compose up -d --build。
# ============================================================

services:

  # --- Redis (Worker Lease for Snowflake ID) ---
  redis:
    image: redis:7.4-alpine
    container_name: crag-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crag-net

  # --- PostgreSQL 17 + pgvector ---
  db:
    image: pgvector/pgvector:pg17
    container_name: crag-db
    environment:
      POSTGRES_DB: crag_platform
      POSTGRES_USER: crag_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin_demo}
      CARG_ACCESS_PASSWORD: ${CARG_ACCESS_PASSWORD:-access_demo}
      CARG_KNOWLEDGE_PASSWORD: ${CARG_KNOWLEDGE_PASSWORD:-knowledge_demo}
      CARG_RAG_PASSWORD: ${CARG_RAG_PASSWORD:-rag_demo}
    volumes:
      - ./data/pgdata-platform:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crag_admin -d crag_platform"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crag-net

  # --- Python Sidecar Model Service ---
  model-init:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: crag-model-init
    user: root
    command: ["python", "-u", "download_models.py"]
    healthcheck:
      disable: true
    environment:
      MODELSCOPE_CACHE: /models/modelscope
    volumes:
      - ./.models/modelscope:/models/modelscope
    networks:
      - crag-net

  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: crag-sidecar
    ports:
      - "8001:8001"
    environment:
      MODELSCOPE_CACHE: /models/modelscope
      EMBEDDING_MODEL_PATH: /models/modelscope/iic__nlp_gte_sentence-embedding_chinese-base
      RERANK_MODEL_PATH: /models/modelscope/BAAI__bge-reranker-v2-m3
    volumes:
      - ./.models/modelscope:/models/modelscope:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    networks:
      - crag-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # --- Access Service ---
  # 固定暴露本地诊断端口 8091。启用 CRAG_SERVICE_PROFILES=smoke 后，
  # 同端口额外注册 /api/v1/smoke/access/** Controller 与 application-smoke.yml 测试密钥。
  access-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE_MODULE: crag-access-service
    container_name: crag-access-service
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: ${CRAG_SERVICE_PROFILES:-}
      SPRING_APPLICATION_JSON: >
        {
          "spring.datasource.url": "jdbc:postgresql://db:5432/crag_platform?currentSchema=access",
          "spring.datasource.username": "crag_access",
          "spring.datasource.password": "${CARG_ACCESS_PASSWORD:-access_demo}",
          "spring.data.redis.host": "redis",
          "spring.data.redis.port": 6379,
          "crag.id.service-domain": "access",
          "crag.id.required-entities": "USER,LOGIN_ACCOUNT,TENANT,TENANT_MEMBERSHIP,REFRESH_SESSION,API_KEY,ACCESS_EVENT",
          "crag.event.claim-idle": "5s",
          "crag.event.max-deliveries": 3,
          "crag.grpc.server.allowed-callers.console-api": "${CONSOLE_API_SERVICE_TOKEN:-console-token-demo}",
          "crag.grpc.server.allowed-callers.open-api": "${OPEN_API_SERVICE_TOKEN:-open-token-demo}"
        }
      # Demo-only secrets (local/demo deployment; production must inject real secrets).
      CARG_ACCESS_JWT_KID: access-demo-key-1
      CARG_ACCESS_REFRESH_PEPPER: access-refresh-demo-pepper-0123456789
      CARG_ACCESS_API_KEY_PEPPER: access-apikey-demo-pepper-9876543210
