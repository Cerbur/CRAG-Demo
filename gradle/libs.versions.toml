# CRAG-Demo — Gradle Version Catalog
# Spring Boot 4.1.0, Spring AI 2.0.0 与 dependency-management 版本的唯一事实来源.
# 子模块不得重复声明这些版本或使用 Gradle platform() 管理同一框架.

[versions]
spring-boot = "4.1.0"
spring-ai = "2.0.0"
spring-dependency-management = "1.1.7"

[libraries]
spring-ai-commons = { group = "org.springframework.ai", name = "spring-ai-commons", version.ref = "spring-ai" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
